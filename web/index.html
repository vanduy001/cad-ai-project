<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Thiet Ke CAD</title>
<style>
body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
h1 { font-size: 24px; }
textarea { width: 100%; height: 100px; font-size: 16px; padding: 10px; box-sizing: border-box; }
button { margin-top: 10px; padding: 10px 24px; font-size: 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
button:disabled { background: #999; }
#status { margin-top: 20px; padding: 15px; border-radius: 6px; background: #f3f4f6; display: none; }
#status.show { display: block; }
a.download { display: inline-block; margin-top: 10px; background: #16a34a; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; }
</style>
</head>
<body>
<h1>AI Thiet Ke CAD Tu Ngon Ngu Tu Nhien</h1>
<p>Nhap mo ta chi tiet co khi ban muon, vi du: "ve cho toi 1 cai truc tron dai 50mm duong kinh 12mm"</p>
<textarea id="req" placeholder="Nhap mo ta o day..."></textarea><br>
<button id="btn" onclick="generate()">Tao ban ve</button>
<div id="status"></div>

<script>
async function generate() {
  const req = document.getElementById('req').value.trim();
  const status = document.getElementById('status');
  const btn = document.getElementById('btn');
  if (!req) { alert('Vui long nhap mo ta'); return; }

  btn.disabled = true;
  status.className = 'show';
  status.innerHTML = 'Dang phan tich yeu cau va dung mo hinh 3D... (co the mat 10-40 giay)';

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({request: req})
    });
    const data = await res.json();

    if (data.success) {
      status.innerHTML = 'Hoan tat! ' + data.message +
        '<br><a class="download" href="' + data.download_url + '">Tai file STEP</a>';
    } else {
      status.innerHTML = 'Loi: ' + data.message;
    }
  } catch (e) {
    status.innerHTML = 'Loi ket noi toi server: ' + e;
  }
  btn.disabled = false;
}
</script>
</body>
</html>
